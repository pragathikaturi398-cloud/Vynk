version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vynk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vynk_user
      POSTGRES_PASSWORD: vynk_password
      POSTGRES_DB: vynk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vynk_user -d vynk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vynk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vynk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://vynk_user:vynk_password@postgres:5432/vynk_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_production_change_me
      JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_change_me
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vynk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
